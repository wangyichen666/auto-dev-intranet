[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "auto-dev-intranet"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["fastapi==0.115.12", "pydantic==2.11.7", "uvicorn==0.34.3", "dtcoder-agentic-dev @ git+https://github.com/wangyichen666/agent-auto-dev.git@c414544a8b1c137357892461b84050f8d85f92c8"]
[project.optional-dependencies]
dev = ["pytest==8.4.1", "httpx==0.28.1", "ruff==0.12.2"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
[tool.ruff]
line-length = 100
target-version = "py310"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
